# F1tenth_PoliMI: copy of f1tenth_gym_ros config/sim.yaml at the commit pinned in
# docker/ros/Dockerfile (GYM_ROS_REF 0839576), in car mode for polimi_sim. Re-copy it when
# GYM_ROS_REF is bumped. Launch: simcar (see docs/software/sim_car.md).
# Differences from upstream:
#   ego_drive_topic  sim/drive: the stack's /drive goes through the car's mux and actuation_model.
#   ego_scan_topic   sim/scan_unused: /scan comes from lidar_model. The gym's LiDAR stays on
#                    because its wall collision check runs on that scan (off = no collisions).
#   LiDAR block      SL450 geometry and the car's mount, no noise: a clean reference for /scan.
#   kb_teleop        False: the gym's /cmd_vel path bypasses the mux. teleop_bridge takes /cmd_vel.
#   map_path, sx, sy, stheta: the map this file is named after.

bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'sim/scan_unused'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'sim/drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # LiDAR related parameters
    lidar_enabled: True
    # Keep equal to ros2_ws/config/car/laser_mount.yaml (x, y, yaw)
    lidar_base_link_to_lidar_tf: [0.27, 0.0, 0.0] # x, y, yaw from base_link to lidar
    lidar_noise_std: 0.0 # lidar_model adds the noise. LiDAR accuracy - modelled as zero-mean Gaussian noise with this standard deviation (in meters)
    
    # laserscan parameters: Orbbec Pulsar SL450, 270° FOV at 0.2° (upstream default: SICK TIM571, 819 beams)
    # f1tenth_gym computes resolution = (scan_angle_max - scan_angle_min) / (scan_num_beams - 1),
    # so 270° / 0.2° + 1 = 1351 beams.
    scan_num_beams: 1351
    scan_range_min: 0.05 # 5cm
    scan_range_max: 25.0 # 25m (SL450: 45 m at 70-90% reflectivity, 15 m at 10%; the gym ignores reflectivity)
    # Angles have to be in degrees
    scan_angle_min: -135.0 # -135°
    scan_angle_max: 135.0 # 135°

    # map parameters
    map_path: 'maps/levine'
    map_img_ext: '.png'

    # car parameters and scale
    # Supported vehicle parameters are 'f1tenth', 'fullscale', and 'f1fifth'
    vehicle_params: 'f1tenth'
    scale: 1.0

    # number of agents. Must be >=1 since the first agent is the ego car.
    # Can be overridden at launch time with num_agent:=<n>. 
    # There is no upper limit, but every opponent needs an sx/sy/stheta below or the bridge
    # refuses to start.
    num_agent: 1

    # ego starting pose on map
    sx: -12.0
    sy: 0.0
    stheta: 0.0

    # Poses for 3 opponents below; add sx4/sy4/stheta4 and so on to race more.

    # opp 1 starting pose on map
    sx1: -5.5
    sy1: 0.0
    stheta1: 0.0

    # opp 2 starting pose on map
    sx2: 1.0
    sy2: 0.0
    stheta2: 0.0

    # opp 3 starting pose on map
    sx3: 8.0
    sy3: 0.0
    stheta3: 0.0

    # opp 4 starting pose on map
    sx4: -12.0
    sy4: 8.5
    stheta4: 3.14

    # opp 5 starting pose on map
    sx5: -5.5
    sy5: 8.5
    stheta5: 3.14

    # opp 6 starting pose on map
    sx6: 1.0
    sy6: 8.5
    stheta6: 3.14

    # opp 7 starting pose on map
    sx7: 8.0
    sy7: 8.5
    stheta7: 3.14

    # teleop
    kb_teleop: False

    # use simulation time
    # When true, the bridge will publish the simulation time on the /clock topic
    # and the simulation will run as fast as possible.
    use_sim_time: False

    # If false, only steps sim on new /drive messages.
    # If true, the simulation will step using a timer callback.
    async_mode: True

foxglove:
  ros__parameters:
    # Automatically open Foxglove when the launch file starts.
    # Note: the launch file reads these two defaults from the package's own sim.yaml,
    # not from config:=, so they have no effect here. `sim` passes open_foxglove:=false.
    open_foxglove: True
    # Where to open Foxglove. Valid values: 'browser' or 'studio'.
    target: 'browser'
